<svg width="850" height="300" viewBox="0 0 850 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #2e3440; stroke: #4c566a; stroke-width: 1.5; rx: 12px; }
    .title { fill: #88c0d0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; }
    .text { fill: #d8dee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
    .muted { fill: #4c566a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; }
    .grid { stroke: #434c5e; stroke-width: 1; stroke-dasharray: 4; opacity: 0.5; }
    .axis { stroke: #4c566a; stroke-width: 1.5; }
  </style>

  <!-- Filters for 30% shadow transparency and offset -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="3" flood-color="#191d24" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Perfectly Rounded Outer Card Border & Background -->
  <rect x="10" y="10" width="830" height="280" rx="12" class="bg"/>

